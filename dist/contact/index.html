<main id="main"><section class="contact-page wrap"><div class="section-label">CONTACT</div><div class="contact-grid"><div><h1>Your idea.<br><em>Let's talk.</em></h1><p>Tell us what you're planning. We'll reply by email.</p></div><form id="enquiry-form" action="https://formsubmit.co/dionnikila330@gmail.com" method="POST"><input type="hidden" name="_subject" value="New Plexis Media enquiry"><input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="postcard-heading"><span>YOUR MESSAGE</span><span class="postage" aria-hidden="true"><img class="brand-symbol" src="/assets/brand/symbol-primary.svg" alt="" width="208" height="193" aria-hidden="true"></span></div><div class="field-pair"><label>Your name<input name="name" autocomplete="name" required maxlength="120"></label><label>Email address<input name="email" type="email" autocomplete="email" required maxlength="254"></label></div><label><span class="field-label">Brand or business <small>(optional)</small></span><input name="brand" autocomplete="organization" maxlength="160"></label><label>What can we help with?<select name="service"><option>Let's figure it out together</option><option>Brand & strategy</option><option>Content & creative</option><option>Social & community</option><option>Campaigns & growth</option></select></label><label>A little about your project<textarea name="message" required rows="5" maxlength="5000" placeholder="The idea, the ambition, anything you'd like us to know…"></textarea></label><button class="button" type="submit">Send enquiry ↗</button><p id="form-status" role="status" aria-live="polite"></p></form></div></section><div class="page-footer">      <footer class="site-footer wrap"><a class="brand-logo" href="/" aria-label="Plexis Media home"><img src="/assets/brand/logo-white.svg" alt="Plexis Media" width="708" height="239" decoding="async"></a><span>© Plexis Media</span><a href="/">Home <span aria-hidden="true">↗</span></a></footer>
